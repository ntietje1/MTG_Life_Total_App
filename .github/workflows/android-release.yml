name: Android Release Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-aab:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode Android keystore
        env:
          LIFELINKED_ANDROID_KEYSTORE_BASE64: ${{ secrets.LIFELINKED_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LIFELINKED_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing LIFELINKED_ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lifelinked-signing"
          printf '%s' "$LIFELINKED_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifelinked-signing/release.keystore"
          echo "LIFELINKED_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/lifelinked-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Verify Android signing secrets
        env:
          LIFELINKED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LIFELINKED_ANDROID_KEYSTORE_PASSWORD }}
          LIFELINKED_ANDROID_KEY_ALIAS: ${{ secrets.LIFELINKED_ANDROID_KEY_ALIAS }}
          LIFELINKED_ANDROID_KEY_PASSWORD: ${{ secrets.LIFELINKED_ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in LIFELINKED_ANDROID_KEYSTORE_PASSWORD LIFELINKED_ANDROID_KEY_ALIAS LIFELINKED_ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing $secret_name secret"
              exit 1
            fi
          done

      - name: Build signed release bundle
        env:
          LIFELINKED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LIFELINKED_ANDROID_KEYSTORE_PASSWORD }}
          LIFELINKED_ANDROID_KEY_ALIAS: ${{ secrets.LIFELINKED_ANDROID_KEY_ALIAS }}
          LIFELINKED_ANDROID_KEY_PASSWORD: ${{ secrets.LIFELINKED_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :verifyReleaseVersion :androidApp:bundleRelease --no-daemon --warning-mode all

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-artifacts
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/**
          if-no-files-found: error
